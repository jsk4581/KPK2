<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTHn 데모</title>
  <!-- STATIC FALLBACK SNAPSHOT — works from a double-click (file://): no modules, no fetch, no backend.
       Built from index.html + styles.css + logic.js + app.js + data/fixture.json.
       Re-sync per RECOVERY.md "정적 fallback 절차" at the 14:00 freeze and before submit-gate check 8.
       tests/fallback.test.mjs compares it with logic.js / fixture.json only while the synced line
       below matches; when it does not, the parity tests SKIP and print the line to paste. -->
  <!-- synced: logic.js sha256=76d717a9f7e0 · fixture.json sha256=ada6a8f302e8 -->
  <style>
/* styles.css — minimal, dependency-free. Light/dark via prefers-color-scheme. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1b1f24;
  --muted: #5b6470;
  --border: #d9dde3;
  --accent: #2f5bd3;
  --accent-text: #ffffff;
  --badge-bg: #fff3d6;
  --badge-text: #7a4b00;
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --surface: #1a1f25;
    --text: #e8ebef;
    --muted: #9aa4b1;
    --border: #2c333c;
    --accent: #6f93f0;
    --accent-text: #0d1117;
    --badge-bg: #3a2e12;
    --badge-text: #f5d58a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

.shell {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.masthead h1 { margin: 4px 0 6px; font-size: 1.8rem; }
.lead { margin: 0 0 16px; color: var(--muted); }

.badge {
  display: inline-block;
  margin: 0;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: 0.8rem;
  font-weight: 600;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.card h2 { margin: 0 0 8px; font-size: 1rem; color: var(--muted); }

label { display: block; margin-bottom: 6px; font-weight: 600; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

input[type="text"] {
  flex: 1 1 240px;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

button {
  padding: 10px 18px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.output { margin: 0; font-size: 1.1rem; word-break: break-word; }
.output[data-reason="empty-input"], .output[data-reason="no-rows"] { color: var(--muted); }

.source { margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); }
.source[data-source="fixture"]::before { content: "● "; color: #c08a00; }
.source[data-source="sheet"]::before { content: "● "; color: #1f9d55; }

.rows { margin: 0; padding-left: 18px; font-size: 0.9rem; }
.rows li { margin: 2px 0; word-break: break-word; }

.foot { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 18px; }

button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }

.error-banner { margin: 0 0 12px; padding: 10px 14px; border-radius: 8px; background: #b42318; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="badge" id="app-sim-badge">시뮬레이션 · 가상(synthetic) 데이터 · 정적 fallback</p>
      <h1 id="app-title">HTHn 데모</h1>
      <p class="lead">한 줄 문장을 넣으면 다음 행동 한 줄을 보여줍니다.</p>
    </header>

    <p id="app-error" class="error-banner" role="alert" hidden style="margin:0 0 12px;padding:10px 14px;border-radius:8px;background:#b42318;color:#fff;font-weight:600"></p>

    <form id="app-form" class="card" autocomplete="off">
      <label for="app-input">입력</label>
      <div class="row">
        <input id="app-input" name="input" type="text" maxlength="200"
               placeholder="예: pitch deck 준비" aria-describedby="app-source">
        <button id="app-run" type="submit">핵심 행동</button>
        <button id="app-reset" type="button" class="secondary">초기화</button>
      </div>
    </form>

    <section class="card" aria-labelledby="app-output-title">
      <h2 id="app-output-title">출력</h2>
      <p id="app-output" class="output" aria-live="polite">아직 실행하지 않았습니다.</p>
    </section>

    <section class="card" aria-labelledby="app-rows-title">
      <h2 id="app-rows-title">데이터</h2>
      <p id="app-source" class="source" data-state="loading" data-source="" data-count="0">데이터: 불러오는 중…</p>
      <ul id="app-rows" class="rows"></ul>
    </section>

    <footer class="foot">
      화면의 데이터는 모두 가상(synthetic)입니다. 실제 사람·고객 정보가 아닙니다.
    </footer>
  </main>
  <script>
  (function () {
    'use strict';

    /* BEGIN config (inlined from config.js; fallback is always fixture mode) */
    var SHEET_API_URL = '';
    var FIXTURE_URL = 'data/fixture.json';
    var SHEET_TIMEOUT_MS = 0;
    /* END config */

    /* BEGIN fixture (inlined from data/fixture.json) */
    var FIXTURE =
    {
      "_label": "synthetic",
      "_note": "[SIMULATION] 가상 데이터 — 실제 사람·고객이 아니다. 열은 app/sheet/Code.gs seedSyntheticSheet와 같다.",
      "rows": [
        { "id": "syn-001", "user": "agent_alpha", "goal": "Complete prototype wireframe", "status": "done", "updated_at": "2026-10-20T09:00:00Z", "label": "synthetic" },
        { "id": "syn-002", "user": "agent_bravo", "goal": "Connect static frontend to Sheet API", "status": "in_progress", "updated_at": "2026-10-20T09:15:00Z", "label": "synthetic" },
        { "id": "syn-003", "user": "agent_charlie", "goal": "Write synthetic dataset generator", "status": "done", "updated_at": "2026-10-20T09:30:00Z", "label": "synthetic" },
        { "id": "syn-004", "user": "agent_delta", "goal": "Prepare 3-minute pitch deck", "status": "todo", "updated_at": "2026-10-20T09:45:00Z", "label": "synthetic" },
        { "id": "syn-005", "user": "agent_echo", "goal": "Verify mobile viewport layout", "status": "in_progress", "updated_at": "2026-10-20T10:00:00Z", "label": "synthetic" }
      ]
    }
    ;
    /* END fixture */

    /* BEGIN logic (inlined from logic.js) */
    // logic.js — pure functions for the demo's one core action.
    // ES module with no DOM, no network, no clock: runs unchanged in the browser and in node.
    // On event day, Build replaces decideNextAction with PRD sentence 3 (the core action)
    // and writes the test in app/tests/logic.test.mjs FIRST (SMOKE.md -> tests -> code).
    // fallback.html inlines this file (without the `export` keywords); re-sync it per RECOVERY.md.

    const MAX_INPUT_LENGTH = 200;
    const SYNTHETIC_LABEL = 'synthetic';

    // Lower number = more urgent. Unknown statuses sort last.
    const STATUS_PRIORITY = { blocked: 0, in_progress: 1, todo: 2, done: 3 };

    // Collapse whitespace, trim, and cap the length. Never throws.
    function normalizeInput(raw) {
      if (raw === null || raw === undefined) return '';
      return String(raw).replace(/\s+/g, ' ').trim().slice(0, MAX_INPUT_LENGTH);
    }

    // Only rows explicitly labelled synthetic may reach the screen (safety rule 2).
    function isSyntheticRow(row) {
      return Boolean(row) && typeof row === 'object' && row.label === SYNTHETIC_LABEL;
    }

    // Accepts a bare array, the fixture shape { rows: [...] }, or the Apps Script
    // shape { ok: true, rows: [...] }. Throws when the payload reports an error.
    function extractRows(payload) {
      if (Array.isArray(payload)) return payload.filter(isSyntheticRow);
      if (!payload || typeof payload !== 'object') {
        throw new Error('data payload is not an object');
      }
      if (payload.ok === false) {
        throw new Error(String(payload.error || 'data source reported ok=false'));
      }
      if (!Array.isArray(payload.rows)) {
        throw new Error('data payload has no rows array');
      }
      return payload.rows.filter(isSyntheticRow);
    }

    // Empty or missing URL -> fixture mode. Any non-empty URL -> sheet mode.
    function pickDataSource(sheetUrl) {
      return typeof sheetUrl === 'string' && sheetUrl.trim() !== '' ? 'sheet' : 'fixture';
    }

    // Text for the data source indicator. Always names the source so a fallback is never silent.
    function describeSource(source, count, note) {
      const base = `데이터: ${source} · synthetic ${count}행`;
      return note ? `${base} · ${note}` : base;
    }

    // Lowercased search tokens of length >= 2 (drops single-character noise).
    function tokenize(text) {
      return normalizeInput(text)
        .toLowerCase()
        .split(/[^\p{L}\p{N}_]+/u)
        .filter((token) => token.length >= 2);
    }

    // Number of input tokens found in the row's searchable text.
    function scoreRow(tokens, row) {
      const haystack = [row.id, row.user, row.goal, row.status]
        .map((value) => (value === undefined || value === null ? '' : String(value)))
        .join(' ')
        .toLowerCase();
      return tokens.reduce((score, token) => (haystack.includes(token) ? score + 1 : score), 0);
    }

    function statusRank(row) {
      const rank = STATUS_PRIORITY[row.status];
      return rank === undefined ? 99 : rank;
    }

    function compareById(a, b) {
      const left = String(a.id);
      const right = String(b.id);
      if (left < right) return -1;
      if (left > right) return 1;
      return 0;
    }

    // Deterministic ordering: more urgent status first, then id ascending.
    function sortByUrgency(rows) {
      return [...rows].sort((a, b) => statusRank(a) - statusRank(b) || compareById(a, b));
    }

    // The core action of the generic scaffold: given one line of input and the loaded
    // rows, pick the single next action. Same input + same rows -> same object.
    //
    // Returns { ok, input, reason, action, pickedId, matchedIds, rowCount }
    //   reason: 'empty-input' | 'no-rows' | 'match' | 'no-match'
    //   action: Korean sentence shown in the output panel; contains the input when non-empty.
    function decideNextAction(input, rows) {
      const text = normalizeInput(input);
      const usable = Array.isArray(rows) ? rows.filter(isSyntheticRow) : [];
      const base = { input: text, pickedId: null, matchedIds: [], rowCount: usable.length };

      if (text === '') {
        return { ...base, ok: false, reason: 'empty-input', action: '입력이 비어 있습니다. 한 줄을 입력하세요.' };
      }
      if (usable.length === 0) {
        return { ...base, ok: false, reason: 'no-rows', action: `「${text}」 → 불러온 가상 데이터가 없습니다.` };
      }

      const tokens = tokenize(text);
      const scored = usable
        .map((row) => ({ row, score: scoreRow(tokens, row) }))
        .filter((entry) => entry.score > 0)
        .sort((a, b) => b.score - a.score || statusRank(a.row) - statusRank(b.row) || compareById(a.row, b.row));

      const matched = scored.map((entry) => entry.row);
      const picked = matched.length > 0 ? matched[0] : sortByUrgency(usable)[0];
      const reason = matched.length > 0 ? 'match' : 'no-match';

      return {
        ...base,
        ok: true,
        reason,
        pickedId: String(picked.id),
        matchedIds: matched.map((row) => String(row.id)),
        action: `「${text}」 → 다음 행동: ${picked.goal} (${picked.id} · 상태 ${picked.status})`,
      };
    }
    /* END logic */

    /* BEGIN app (inlined from app.js) */

    // Element ids shared by index.html, fallback.html, tests/index.html and logic.test.mjs.
    const ELEMENT_IDS = {
      form: 'app-form',
      input: 'app-input',
      button: 'app-run',
      output: 'app-output',
      source: 'app-source',
      rows: 'app-rows',
    };

    // Optional public-demo controls (app/DEPLOY.md "공개 데모 운영"). Looked up with getElementById and
    // skipped when absent, so older snapshots such as fallback.html keep working without them.
    const OPTIONAL_IDS = {
      reset: 'app-reset',
      error: 'app-error',
    };

    const INITIAL_OUTPUT = '아직 실행하지 않았습니다.';

    function getElements(doc) {
      const els = {};
      for (const [key, id] of Object.entries(ELEMENT_IDS)) {
        const el = doc.getElementById(id);
        if (!el) throw new Error(`missing element #${id}`);
        els[key] = el;
      }
      return els;
    }

    function getOptionalElements(doc) {
      const els = {};
      for (const [key, id] of Object.entries(OPTIONAL_IDS)) els[key] = doc.getElementById(id) || null;
      return els;
    }

    // Error banner: visible text whenever something failed, hidden otherwise. Never silent.
    function showError(errorEl, message) {
      if (!errorEl) return;
      errorEl.textContent = message ? `오류: ${message} — 화면을 새로고침하거나 「초기화」를 누르세요.` : '';
      errorEl.hidden = !message;
    }

    // Back to the first screen for the next judge: empty input, initial output, data kept.
    function resetView(els) {
      els.input.value = '';
      els.output.textContent = INITIAL_OUTPUT;
      els.output.dataset.reason = 'reset';
    }

    async function fetchJson(fetchImpl, url, timeoutMs) {
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = controller && timeoutMs ? setTimeout(() => controller.abort(), timeoutMs) : null;
      try {
        const response = await fetchImpl(url, controller ? { signal: controller.signal } : undefined);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    // Returns { source, rows, note }. Never throws: a failed sheet falls back to the fixture
    // and says so in `note` (no silent degrade); a failed fixture returns zero rows with a note.
    async function loadRows({ sheetUrl, fixtureUrl, fetchImpl, timeoutMs }) {
      const doFetch = fetchImpl || globalThis.fetch;
      let note = '';
      if (pickDataSource(sheetUrl) === 'sheet') {
        try {
          const rows = extractRows(await fetchJson(doFetch, sheetUrl.trim(), timeoutMs));
          return { source: 'sheet', rows, note };
        } catch (err) {
          note = `sheet 실패 → fixture 대체 (${err && err.message ? err.message : err})`;
        }
      }
      try {
        const rows = extractRows(await fetchJson(doFetch, fixtureUrl, timeoutMs));
        return { source: 'fixture', rows, note };
      } catch (err) {
        const reason = `fixture 로드 실패 (${err && err.message ? err.message : err})`;
        return { source: 'fixture', rows: [], note: note ? `${note} · ${reason}` : reason };
      }
    }

    // Rows are rendered with textContent only: the sheet is a public, writable endpoint.
    function renderRows(doc, listEl, rows) {
      const items = rows.map((row) => {
        const li = doc.createElement('li');
        li.textContent = `${row.id} · ${row.goal} · ${row.status}`;
        return li;
      });
      listEl.replaceChildren(...items);
    }

    function renderSource(sourceEl, loaded) {
      sourceEl.textContent = describeSource(loaded.source, loaded.rows.length, loaded.note);
      sourceEl.dataset.source = loaded.source;
      sourceEl.dataset.count = String(loaded.rows.length);
      sourceEl.dataset.state = 'ready';
    }

    function runCoreAction(els, rows) {
      const result = decideNextAction(els.input.value, rows);
      els.output.textContent = result.action;
      els.output.dataset.reason = result.reason;
      return result;
    }

    // Wires the form, then loads data. Resolves to { els, state } once the data is on screen.
    async function boot(doc, options = {}) {
      const els = getElements(doc);
      const state = { rows: [], source: null };

      const extra = getOptionalElements(doc);

      els.form.addEventListener('submit', (event) => {
        event.preventDefault();
        runCoreAction(els, state.rows);
      });
      if (extra.reset) extra.reset.addEventListener('click', () => resetView(els));

      els.source.dataset.state = 'loading';
      els.source.textContent = '데이터: 불러오는 중…';

      const loaded = await loadRows({
        sheetUrl: options.sheetUrl !== undefined ? options.sheetUrl : SHEET_API_URL,
        fixtureUrl: options.fixtureUrl || FIXTURE_URL,
        fetchImpl: options.fetchImpl,
        timeoutMs: options.timeoutMs !== undefined ? options.timeoutMs : SHEET_TIMEOUT_MS,
      });
      state.rows = loaded.rows;
      state.source = loaded.source;
      renderRows(doc, els.rows, loaded.rows);
      renderSource(els.source, loaded);
      showError(extra.error, loaded.note);
      return { els, state, extra };
    }
    /* END app */

    // Serve the inlined fixture instead of fetching data/fixture.json.
    function inlineFetch() {
      return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(FIXTURE); } });
    }

    boot(document, { sheetUrl: SHEET_API_URL, fixtureUrl: FIXTURE_URL, fetchImpl: inlineFetch, timeoutMs: SHEET_TIMEOUT_MS })
      .then(function (booted) {
        var el = booted.els.source;
        el.textContent = el.textContent + ' · 정적 fallback 스냅샷';
      })
      .catch(function (err) {
        showError(document.getElementById(OPTIONAL_IDS.error), err && err.message ? err.message : String(err));
      });
  })();
  </script>
</body>
</html>
