<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTHn 데모</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Event day: Build changes the title, the lead sentence (PRD sentence 4) and the input hint.
       Keep every id below: tests/index.html, tests/logic.test.mjs and fallback.html depend on them.
       app-reset (judge reset) and app-error (error banner) are optional: app.js skips them when absent.
       No login, no API key in any file served to the browser (app/DEPLOY.md). -->
</head>
<body>
  <p id="file-guard" hidden style="margin:0;padding:12px 16px;background:#b42318;color:#fff;font-weight:700">
    file://에서는 동작하지 않습니다 — 같은 폴더의 fallback.html을 여세요 (또는 배포 URL로 여세요).
  </p>
  <script>
    // Classic guard: Chrome and Edge block ES modules on file://, so the app below would stay blank.
    if (location.protocol === 'file:') document.getElementById('file-guard').hidden = false;
  </script>
  <main class="shell">
    <header class="masthead">
      <p class="badge" id="app-sim-badge">시뮬레이션 · 가상(synthetic) 데이터</p>
      <h1 id="app-title">HTHn 데모</h1>
      <p class="lead">한 줄 문장을 넣으면 다음 행동 한 줄을 보여줍니다.</p>
    </header>

    <p id="app-error" class="error-banner" role="alert" hidden style="margin:0 0 12px;padding:10px 14px;border-radius:8px;background:#b42318;color:#fff;font-weight:600"></p>

    <form id="app-form" class="card" autocomplete="off">
      <label for="app-input">입력</label>
      <div class="row">
        <input id="app-input" name="input" type="text" maxlength="200"
               placeholder="예: pitch deck 준비" aria-describedby="app-source">
        <button id="app-run" type="submit">핵심 행동</button>
        <button id="app-reset" type="button" class="secondary">초기화</button>
      </div>
    </form>

    <section class="card" aria-labelledby="app-output-title">
      <h2 id="app-output-title">출력</h2>
      <p id="app-output" class="output" aria-live="polite">아직 실행하지 않았습니다.</p>
    </section>

    <section class="card" aria-labelledby="app-rows-title">
      <h2 id="app-rows-title">데이터</h2>
      <p id="app-source" class="source" data-state="loading" data-source="" data-count="0">데이터: 불러오는 중…</p>
      <ul id="app-rows" class="rows"></ul>
    </section>

    <footer class="foot">
      화면의 데이터는 모두 가상(synthetic)입니다. 실제 사람·고객 정보가 아닙니다.
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
